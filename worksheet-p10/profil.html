<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Aqila Sabrina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Aqila Sabrina</h1>
    <p>Mahasiswa Informatika</p>

  <main>

      <h2>Keahlian</h2>

      </ul>
    </section>

    <section>
      <h2>Daftar Proyek</h2>
      <div id="filter" class="filter-row">

        <button type="button" class="filter" data-category="aplikasi">Aplikasi</button>

      <p id="status" class="status" role="status" hidden></p>

      <p id="empty" class="empty" hidden>Belum ada proyek.</p>
    </section>

    <figure>
      <img src="movie.jpg" alt="A collection of film posters" width="640" height="600">
      <figcaption>A list of several movie posters</figcaption>
    </figure>
  </main>

  <footer>
    <p>Aqila Sabrina · 25523097 · 2026</p>
  </footer>

  <script type="module" src="js/app.js"></script>
